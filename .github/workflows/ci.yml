name: CI

on:
  push:
    branches: [ "main", "master", "fix/*" ]
  pull_request:
    branches: [ "main", "master", "fix/*" ]

jobs:
  server-tests:
    name: PHP ${{ matrix.php }}
    env:
      APP_ENV: testing
      LICENSE_SIGNING_KEY_ID: ci-test-key
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, openssl, pdo, sqlite, pdo_sqlite, json, fileinfo, curl
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Generate ephemeral license signing keys
        run: |
          key_dir="$(mktemp -d)"
          trap 'rm -rf "$key_dir"' EXIT
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$key_dir/private.pem"
          openssl pkey -in "$key_dir/private.pem" -pubout -out "$key_dir/public.pem"
          private_key="$(base64 -w0 "$key_dir/private.pem")"
          public_key="$(base64 -w0 "$key_dir/public.pem")"
          echo "::add-mask::$private_key"
          printf 'LICENSE_SIGNING_PRIVATE_KEY=%s\n' "$private_key" >> "$GITHUB_ENV"
          printf 'LICENSE_SIGNING_PUBLIC_KEY=%s\n' "$public_key" >> "$GITHUB_ENV"

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Composer Audit
        run: composer audit

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run static analysis (PHPStan / Larastan)
        run: vendor/bin/phpstan analyse --no-progress

      - name: Run test suite
        run: php artisan test
