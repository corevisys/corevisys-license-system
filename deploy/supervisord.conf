[unix_http_server]
file=/tmp/supervisord.sock
chmod=0700

[supervisord]
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisord.sock

[program:corevisys-queue]
directory=/var/www/corevisys
command=php artisan queue:work database --tries=3 --backoff=60 --memory=512
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/var/log/corevisys-queue.log
stderr_logfile=/var/log/corevisys-queue.err.log
user=www-data

[program:corevisys-scheduler]
directory=/var/www/corevisys
command=sh -c "while true; do php artisan schedule:run; sleep 60; done"
autostart=true
autorestart=true
stdout_logfile=/var/log/corevisys-scheduler.log
stderr_logfile=/var/log/corevisys-scheduler.err.log
user=www-data
